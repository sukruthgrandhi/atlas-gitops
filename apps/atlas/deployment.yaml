apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas
  namespace: atlas
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/instance: atlas
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas
      app.kubernetes.io/instance: atlas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas
        app.kubernetes.io/instance: atlas
    spec:
      # Private Harbor project; create once with `kubectl -n atlas create secret docker-registry harbor-registry ...`
      imagePullSecrets:
        - name: harbor-registry
      automountServiceAccountToken: false
      # nginx-unprivileged runs as uid 101
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atlas
          # CI pushes `latest` and the commit SHA; pin to a SHA for reproducible deploys
          image: harboursukruth.duckdns.org/general/atlas:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            # nginx writes its pid and temp files here; root FS is read-only
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
