apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: atlas

  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/sukruthgrandhi/atlas-gitops.git
    targetRevision: main
    path: apps/atlas

  destination:
    server: https://kubernetes.default.svc
    namespace: atlas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true